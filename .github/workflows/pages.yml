name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
  TERRAFORM_VERSION: "1.9.8"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install kubeconform (checksum verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$RUNNER_TEMP/kc.tgz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kc.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kc.tgz" -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install -r tools/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Build pages (fails on any content rule violation)
        run: python tools/build.py

      - name: Generated files must be committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files differ from what is committed. Run 'python tools/build.py' and commit:"
            git status --short
            git --no-pager diff --stat | tail -5
            exit 1
          fi

      - name: Code syntax audit (shellcheck, ruff, kubeconform, terraform fmt)
        run: python tools/audit_code.py --show 20

      - name: Render the Shop Kustomize overlays
        run: python tools/render_shop.py

      - name: Layout lint and A4 page count
        run: python tools/lint_layout.py

      - name: Browser tests for every topic page, the picker and practice
        run: |
          set -u
          fail=0
          ls -d [0-9][0-9]-*/ | tr -d / | xargs -P 4 -I{} sh -c 'python tools/test_ui.py {} > /tmp/ui_{}.log 2>&1 || { echo "FAILED {}"; tail -5 /tmp/ui_{}.log; exit 255; }' || fail=1
          python tools/test_plan.py || fail=1
          python tools/test_practice.py || fail=1
          exit $fail

      - name: Simulator tests
        run: |
          set -u
          ls sims/tests/test_*.py | xargs -P 4 -I{} sh -c 'python {} > /tmp/$(basename {}).log 2>&1 || { echo "FAILED {}"; tail -8 /tmp/$(basename {}).log; exit 255; }'

      - name: Package the site and check every link
        run: python tools/package_site.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
