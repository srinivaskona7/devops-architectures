<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#0ea5b7" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded shield -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#0b1329" stroke="#1d2d50" stroke-width="2" />

  <!-- Infinity / DevOps Loop in Center -->
  <path d="M32 50 C22 36, 14 64, 28 64 C38 64, 45 52, 50 50 C55 48, 62 36, 72 36 C86 36, 78 64, 68 50 C62 42, 55 52, 50 50 C45 48, 38 36, 32 50 Z" 
        fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Kubernetes / Cloud Helm Accents -->
  <circle cx="50" cy="50" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="23" cy="50" r="3.5" fill="#22d3ee" />
  <circle cx="77" cy="50" r="3.5" fill="#34d399" />
  <circle cx="36" cy="40" r="2.5" fill="#a78bfa" />
  <circle cx="64" cy="60" r="2.5" fill="#fbbf24" />

  <!-- Orbit Ring Indicator -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#22d3ee" stroke-dasharray="3 8" stroke-width="1.8" opacity="0.6" />
</svg>
